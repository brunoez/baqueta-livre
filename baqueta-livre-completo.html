<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pad de estudo para bateristas: 40 rudimentos, mais de 50 grooves e estúdio de viradas. Sem login, sem servidor.">
<title>Baqueta Livre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de pad de estudo em coluna única (até 860px) com barra de abas fixa embaixo.
   Visual de case de turnê: condensada em caixa alta para rótulos e BPM, superfícies planas com borda fina,
   direita (D) em verde-água e esquerda (E) em rosa, latão como cor de ação. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface2:#e2e7eb; --line:#cbd3da;
  --fg:#14181c; --mute:#56626e; --accent:#a35f0f; --accent-ink:#ffffff;
  --R:#0b8276; --L:#bf2f4d; --on-hand:#ffffff;
  --c-cr:#7c3aed; --c-rd:#1d6fd1; --c-hh:#16864a; --c-cx:#d4600c; --c-bu:#c42b2b;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1316; --surface:#171c20; --surface2:#222a30; --line:#2f3a42;
    --fg:#e8edf1; --mute:#93a0ab; --accent:#f0b14c; --accent-ink:#1b1204;
    --R:#43cdbd; --L:#ff7d94; --on-hand:#0a1513; color-scheme:dark;
    --c-cr:#a98bfb; --c-rd:#5aa9ff; --c-hh:#4cd17f; --c-cx:#ff9a47; --c-bu:#ff6b6b;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1316; --surface:#171c20; --surface2:#222a30; --line:#2f3a42;
  --fg:#e8edf1; --mute:#93a0ab; --accent:#f0b14c; --accent-ink:#1b1204;
  --R:#43cdbd; --L:#ff7d94; --on-hand:#0a1513; color-scheme:dark;
    --c-cr:#a98bfb; --c-rd:#5aa9ff; --c-hh:#4cd17f; --c-cx:#ff9a47; --c-bu:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;width:38px;height:38px;color:var(--accent)}
.brand h1{margin:0;font:800 30px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.brand p{margin:3px 0 0;color:var(--mute);font-size:13px}
.icon-btn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

h2{margin:0;font:800 26px/1.05 var(--disp);letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--mute)}
.label{font:700 12px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sec{margin-top:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600}
.pill[aria-pressed="true"],.pill.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger[data-armed]{background:var(--L);border-color:var(--L);color:var(--on-hand)}
.btn:disabled{opacity:.45;cursor:default}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.card{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-width:0}
.card .n{flex:none;width:38px;font:800 30px/1 var(--disp);color:var(--accent);text-align:center}
.card .t{min-width:0}
.card .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.card .t span{display:block;color:var(--mute);font:500 12px/1.5 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{margin:22px 0 0}
.grp+.list{margin-top:8px}

.panel{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;margin-top:16px;min-width:0}
.tip{margin:12px 0 0;color:var(--mute);font-size:14px;max-width:62ch}

/* sticking */
.stk{display:flex;flex-wrap:wrap;gap:16px 18px;padding-top:12px}
.beat{display:flex;gap:5px}
.tk{position:relative;min-width:36px;height:44px;border-radius:10px;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 16px var(--mono);transition:transform .06s}
.tk.r{--c:var(--R)} .tk.l{--c:var(--L)}
.tk.acc{background:var(--c);color:var(--on-hand)}
.tk.rest{--c:var(--line);border-style:dashed;color:var(--mute)}
.tk .gr{position:absolute;top:-9px;left:-4px;font:700 10px/1 var(--mono);background:var(--surface);color:var(--c);border:1px solid var(--c);border-radius:6px;padding:2px 3px}
.tk.on{transform:translateY(-5px) scale(1.1);box-shadow:0 0 0 3px var(--fg)}

/* transporte */
.tp{display:grid;gap:14px}
.tp-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.bpm{display:flex;align-items:baseline;gap:8px}
.bpm-num{font:800 76px/.9 var(--disp);letter-spacing:.01em;font-variant-numeric:tabular-nums;min-width:2.1ch}
.bpm small{font:700 13px var(--disp);letter-spacing:.14em;color:var(--mute)}
.play{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play svg{width:34px;height:34px}
.tp input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.step-btns{display:flex;gap:8px;flex-wrap:wrap}
.step-btns .btn{min-width:56px;font-family:var(--mono)}
.count{min-height:30px;display:flex;align-items:center;gap:10px;font:800 24px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.count em{font-style:normal;font-size:40px;color:var(--fg)}
.vols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
.vols label{display:grid;gap:2px;font-size:13px;color:var(--mute)}
.vols input{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.sess,.nextinfo{font:500 12px var(--mono);color:var(--mute)}
.nextinfo:empty{display:none}
select{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
[hidden]{display:none!important}
input[type=number]{width:78px;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-family:var(--mono)}
.clock{font:800 56px/1 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.org{display:grid;gap:12px;margin-top:10px}
.ramp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.ramp select{width:auto}
.inl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:14px}
.figbtn{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 10px}
.figico{display:inline-flex;flex:none;align-items:center}
.figinfo{display:flex;align-items:center;gap:12px;margin-top:12px;color:var(--mute);font-size:14px}
.figinfo .figico{color:var(--accent)}

/* grades (grooves e estúdio) */
.gridwrap{overflow-x:auto;padding:4px 2px 10px;margin:0 -2px}
.sgrid{display:grid;grid-template-columns:80px repeat(var(--n),34px);gap:4px;align-items:center;width:max-content}
.sgrid .lab{font:700 12px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);position:sticky;left:0;background:var(--surface);z-index:1;padding:6px 0}
.sgrid .hd{width:34px;text-align:center;font:500 11px var(--mono);color:var(--mute);height:20px;line-height:20px;border-radius:6px}
.sgrid .b{justify-self:end}
.sgrid .hd.cur{background:var(--fg);color:var(--bg)}
.cell{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);padding:0;display:grid;place-items:center;font:700 12px var(--mono);color:transparent}
.cell.on{background:var(--accent);border-color:var(--accent)}
.cell.on.hR{background:var(--R);border-color:var(--R)}
.cell.on.hL{background:var(--L);border-color:var(--L)}
.cell.cur{box-shadow:0 0 0 3px var(--fg)}
.cell.hand{height:28px;color:var(--mute);font-size:13px}
.cell.hand.R{background:var(--R);border-color:var(--R);color:var(--on-hand)}
.cell.hand.L{background:var(--L);border-color:var(--L);color:var(--on-hand)}
.cell.ro{cursor:default}
.k-CR{--rc:var(--c-cr)} .k-RD{--rc:var(--c-rd)} .k-HH{--rc:var(--c-hh)} .k-CX{--rc:var(--c-cx)} .k-BU{--rc:var(--c-bu)}
.cell.ro.on{background:var(--rc);border-color:var(--rc)}
.sgrid .lab.k{color:var(--fg);display:flex;align-items:center;gap:7px}
.sgrid .lab.k::before{content:"";flex:none;width:12px;height:12px;border-radius:4px;background:var(--rc)}
.cell.g::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--rc,var(--fg))}
.cell.o::after{content:"";width:14px;height:14px;border-radius:50%;border:3px solid var(--on-hand)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:13px;margin-top:6px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.field{display:grid;gap:6px}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:96px;font:12px/1.4 var(--mono);resize:vertical}
.status{min-height:22px;margin:8px 0 0;color:var(--mute);font-size:14px}
.saved{display:grid;gap:8px;margin-top:10px}
.saved .it{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.saved .it b{display:block;overflow-wrap:anywhere}
.saved .it span{color:var(--mute);font-size:13px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--mute);margin-top:10px}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:42px;padding:0 14px;font-weight:600}
.num{font:800 54px/.9 var(--disp);color:var(--accent)}
details summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:6px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;max-width:280px;border:0;background:transparent;border-radius:12px;padding:8px 6px;display:grid;justify-items:center;gap:2px;color:var(--mute);font:700 13px var(--disp);letter-spacing:.12em;text-transform:uppercase;min-height:54px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
@media (max-width:420px){.bpm-num{font-size:64px}.play{width:68px;height:68px}}
@media (prefers-reduced-motion:reduce){.tk{transition:none}}
</style>
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 34 L30 10"/><path d="M34 34 L10 10"/><circle cx="31.5" cy="8.5" r="3.5" fill="currentColor"/><circle cx="8.5" cy="8.5" r="3.5" fill="currentColor"/></svg>
      <div><h1>Baqueta Livre</h1><p>Pad de estudo, sem login. Seus exercícios ficam neste aparelho.</p></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Alternar tema claro e escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Seções">
  <button data-v="rud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20 L18 6"/><path d="M20 20 L6 6"/><circle cx="19" cy="5" r="2" fill="currentColor"/><circle cx="5" cy="5" r="2" fill="currentColor"/></svg>Rudimentos</button>
  <button data-v="grv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="8" rx="8" ry="3"/><path d="M4 8v8c0 1.7 3.6 3 8 3s8-1.3 8-3V8"/></svg>Grooves</button>
  <button data-v="est"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>Estúdio</button>
</nav>

<script>
/*DATA-START*/

// alt = repete o padrão espelhado (troca a mão que começa).
const RUD_SRC = [
 [1,'Single Stroke Roll','roll',4,'r l r l'],

 [15,'Seventeen Stroke Roll','roll',8,'r r l l r r l l r r l l r r l l R - - - - - - -',1],

 [17,'Double Paradiddle','diddle',6,'R l r l r r L r l r l l'],
 [18,'Triple Paradiddle','diddle',8,'R l r l r l r r L r l r l r l l'],
 [19,'Single Paradiddle-Diddle','diddle',6,'R l r r l l'],
 [20,'Flam','flam',4,'(l)R - - - (r)L - - -'],
 [21,'Flam Accent','flam',3,'(l)R l r (r)L r l'],
 [22,'Flam Tap','flam',4,'(l)R r (r)L l'],
 [23,'Flamacue','flam',4,'r L r l (l)R - - -',1],

 [29,'Inverted Flam Tap','flam',4,'l (l)R r (r)L'],

 [31,'Drag (Ruff)','drag',4,'(ll)R - - - (rr)L - - -'],
 [32,'Single Drag Tap','drag',4,'(ll)R L (rr)L R'],
 [33,'Double Drag Tap','drag',3,'(ll)R (ll)R l (rr)L (rr)L r'],

 [40,'Triple Ratamacue','drag',3,'(ll)R (ll)R (ll)R l r L']
];
// Grooves: [categoria, nome, chimbal, caixa, bumbo, subdivisão]. x = golpe, o = chimbal aberto, g = nota fantasma.
// ex (opcional): {rd: prato de condução, cr: prato de ataque}
function G(c,n,hh,sd,bd,div,ex){
  var z=new Array(hh.length+1).join('-'); ex=ex||{};
  return {cat:c,name:n,hh:hh,sd:sd,bd:bd,rd:ex.rd||z,cr:ex.cr||z,div:div||4};
}
const GRV_SRC = [
 G('Rock','Rock 8 básico','x-x-x-x-x-x-x-x-','----x-------x---','x-------x-------'),

 G('Rock','Pegada pesada','x-x-x-x-x-x-x-x-','----x-------x---','x-x-x-x-x-x-x-x-'),
 G('Rock','Half-time','x-x-x-x-x-x-x-x-','--------x-------','x-----x-x-------'),
 G('Rock','Ride em semínimas','----------------','----x-------x---','x-----x-x-------',4,{rd:'x---x---x---x---'}),
 G('Rock','Rock com condução em 8','----------------','----x-------x---','x-------x-x-----',4,{rd:'x-x-x-x-x-x-x-x-'}),
 G('Rock','Ataque no 1 com chimbal','x-x-x-x-x-x-x-x-','----x-------x---','x-------x-x-----',4,{cr:'x---------------'}),
 G('Rock','Ataque no 1 e condução','----------------','----x-------x---','x-x-----x-------',4,{rd:'--x-x-x-x-x-x-x-',cr:'x---------------'}),
 G('Pop','Pop 4/4','x-x-x-x-x-x-x-x-','----x-------x---','x-----x---x-----'),
 G('Pop','Pop com ataque no refrão','x-x-x-x-x-x-x-x-','----x-------x---','x-----x---x-----',4,{cr:'x---------------'}),
 G('Pop','Pop dançante','x-x-x-x-x-x-x-x-','----x-------x---','x---x---x---x---'),
 G('Pop','Pop 16 sincopado','xxxxxxxxxxxxxxxx','----x-------x---','x-----x---x-x---'),
 G('Pop','Balada','x---x---x---x---','----x-------x---','x-----x-x-------'),
 G('Pop','Soul','x-x-x-x-x-x-x-x-','----x--g-g--x--g','x-----x---x-----'),
 G('Pop','Cross-stick leve','x-x-x-x-x-x-x-x-','----g-------g---','x-------x-x-----'),
 G('Funk','Funk 16 básico','xxxxxxxxxxxxxxxx','----x--g-g--x--g','x-x-----x-x-----'),

 G('Funk','Sincopado','x-xxx-xxx-xxx-xx','----x-------x---','x--x--x-x--x----'),

function figSvg(v){

    s='<ellipse cx="13" cy="20" rx="8.6" ry="5.4" transform="rotate(-12 13 20)" fill="none" stroke="'+C+'" stroke-width="3.6"/>';
  } else if(v===3||v===6){
    var n=v===3?3:6,gap=v===3?13:10,beams=v===3?1:2; w=gap*(n-1)+24;
    for(var i=0;i<n;i++){ var x=8+gap*i; s+=head(x,33,false,5,3.6)+line(x+4.6,32,x+4.6,13); }
    var x1=12.6,x2=8+gap*(n-1)+4.6;
    for(var b=0;b<beams;b++) s+=line(x1-1,13+b*6,x2+1,13+b*6,3.4);
    s+='<text x="'+((x1+x2)/2)+'" y="8" text-anchor="middle" font-size="11" font-weight="700" font-family="sans-serif" fill="'+C+'">'+v+'</text>';
  } else {
    var fl={2:1,4:2,8:3,16:4}[v]||0;
    s=head(10,32,v===0.5)+line(15,31,15,5);
    for(var k=0;k<fl;k++) s+='<path d="M15 '+(5+k*5.5)+' c3 2.5 6.5 5 5 11" fill="none" stroke="'+C+'" stroke-width="2.4" stroke-linecap="round"/>';
  }

  return {name:'',div:div,bars:bars,bpm:90,cells:cells,hands:Array(n).fill('')};

function mk(name,div,bars,bpm,rows){
  var e=blank(div,bars); e.name=name; e.bpm=bpm;
  Object.keys(rows).forEach(function(k){rows[k].forEach(function(i){e.cells[k][i]=1})});
  var alt=0;
  for(var i=0;i<e.hands.length;i++){
    if(ROWS.some(function(r){return r[0]!=='BU'&&e.cells[r[0]][i]})){ e.hands[i]=alt%2?'L':'R'; alt++; }
  }
  return e;
}
function fromGroove(g){
  var e=blank(g.div,1); e.name=g.name; e.bpm=g.div===3?80:90;
  for(var i=0;i<g.hh.length;i++){
    if(g.hh[i]==='x'||g.hh[i]==='o') e.cells.HH[i]=1;
    if(g.rd[i]==='x') e.cells.RD[i]=1;
    if(g.cr[i]==='x') e.cells.CR[i]=1;
    if(g.sd[i]==='x') e.cells.CX[i]=1;
    if(g.bd[i]==='x') e.cells.BU[i]=1;
  }
  var alt=0; for(var j=0;j<e.hands.length;j++){ if(e.cells.HH[j]||e.cells.CX[j]||e.cells.RD[j]||e.cells.CR[j]){ e.hands[j]=alt%2?'L':'R'; alt++; } }

}

  }
  function clearCur(){ if(cur>=0&&cols[cur]) cols[cur].forEach(function(e){e.classList.remove('cur')}); cur=-1; }

  var tp=Transport({bpm:E.bpm,sounds:['kit'],voices:[['kit','Bateria']],onBpm:function(v){E.bpm=v},onReset:clearCur,
    makeRun:function(){ return {steps:E.cells.CR.length,div:E.div,
      trigger:function(s,when){
        ROWS.forEach(function(r){ if(E.cells[r[0]][s]) Eng.hit(r[0],when,E.hands[s]==='L'&&r[0]!=='BU'?.8:1); });
      },
      onStep:function(s){
        clearCur(); cur=s; cols[s].forEach(function(e){e.classList.add('cur')});
        var el=cols[s][0],bx=gridBox;
        if(el.offsetLeft<bx.scrollLeft+70||el.offsetLeft>bx.scrollLeft+bx.clientWidth-50) bx.scrollLeft=Math.max(0,el.offsetLeft-90);
      }}; }});

  function loadEx(e,id){ Eng.stop(); E=clone(e); Es.curId=id||null; viewEst(main); say('Exercício carregado: '+(e.name||'sem nome')+'.'); }
  function meta(e){ return DIVNAME[e.div]+' · '+e.bars+(e.bars>1?' compassos':' compasso')+' · '+e.bpm+' BPM'; }

  function renderMine(){
    mineBox.textContent=''; var list=Store.load();
    if(!list.length){ mineBox.append(h('div',{class:'empty'},'Nenhum exercício salvo ainda. Monte uma virada na grade, dê um nome e toque em Salvar. Ela fica guardada neste aparelho, neste navegador.')); return; }
    var wrap=h('div',{class:'saved'});
    list.forEach(function(o){
      var e; try{e=deser(o)}catch(x){return}
      var del=h('button',{class:'btn sm danger',onclick:function(){
        if(!del.hasAttribute('data-armed')){ del.setAttribute('data-armed',''); del.textContent='Confirmar exclusão'; setTimeout(function(){ if(del.isConnected){ del.removeAttribute('data-armed'); del.textContent='Excluir'; } },3000); return; }
        Store.save(Store.load().filter(function(z){return z.id!==o.id})); if(Es.curId===o.id) Es.curId=null; renderMine(); say('Exercício excluído.');
      }},'Excluir');
      wrap.append(h('div',{class:'it'},h('div',{style:'min-width:0'},h('b',null,e.name||'Sem nome'),h('span',null,meta(e))),
        h('div',{class:'row'},h('button',{class:'btn sm pri',onclick:function(){loadEx(e,o.id)}},'Abrir'),del)));
    });
    mineBox.append(wrap);
  }
  function renderEx(){
    exBox.textContent='';
    var w=h('div',{class:'saved'});
    EX.forEach(function(e){ w.append(h('div',{class:'it'},h('div',{style:'min-width:0'},h('b',null,e.name),h('span',null,meta(e))),
      h('button',{class:'btn sm',onclick:function(){loadEx(e,null)}},'Carregar'))); });
    exBox.append(w);
  }
  function save(asNew){
    var name=(E.name||'').trim(); if(!name){ say('Dê um nome ao exercício antes de salvar.'); nameIn.focus(); return; }
    E.name=name; var list=Store.load(), o=ser(E);
    if(!asNew&&Es.curId&&list.some(function(z){return z.id===Es.curId})){ o.id=Es.curId; list=list.map(function(z){return z.id===o.id?o:z}); }
    else { o.id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); list.unshift(o); }
    Es.curId=o.id; var ok=Store.save(list); renderMine(); refreshSaveBtns();
    say(ok?'Salvo neste aparelho.':'Este navegador bloqueou o armazenamento. O exercício vale só enquanto a página estiver aberta. Use Compartilhar para guardar o código.');
  }
  var saveBtn=h('button',{class:'btn pri',onclick:function(){save(false)}},'Salvar');
  var saveNew=h('button',{class:'btn',onclick:function(){save(true)}},'Salvar como novo');
  function refreshSaveBtns(){ var edit=!!Es.curId; saveBtn.textContent=edit?'Atualizar':'Salvar'; saveNew.hidden=!edit; }

  /* controles */
  var divSeg=h('div',{class:'seg',role:'group','aria-label':'Subdivisão'});
  [2,3,4,6].forEach(function(d){
    divSeg.append(h('button',{class:'pill','aria-pressed':String(E.div===d),onclick:function(){
      if(E.div===d) return; Eng.stop(); var nm=E.name,bp=E.bpm; E=blank(d,E.bars); E.name=nm; E.bpm=bp; Es.curId=Es.curId; viewEst(main);
      say('Subdivisão trocada para '+DIVNAME[d].toLowerCase()+'. A grade foi limpa.');
    }},DIVNAME[d]));
  });
  var barSeg=h('div',{class:'seg',role:'group','aria-label':'Número de compassos'});
  [1,2,3,4].forEach(function(b){
    barSeg.append(h('button',{class:'pill','aria-pressed':String(E.bars===b),onclick:function(){
      if(E.bars===b) return; Eng.stop(); var old=E, ne=blank(old.div,b), m=Math.min(old.cells.CR.length,ne.cells.CR.length);
      ROWS.forEach(function(r){ for(var i=0;i<m;i++) ne.cells[r[0]][i]=old.cells[r[0]][i]; });
      for(var j=0;j<m;j++) ne.hands[j]=old.hands[j];
      ne.name=old.name; ne.bpm=old.bpm; E=ne; viewEst(main);
    }},String(b)));
  });

  /* compartilhar */
  var shareTa=h('textarea',{id:'est-share',readonly:true,'aria-label':'Código para compartilhar'});
  var impTa=h('textarea',{id:'est-import',placeholder:'Cole aqui um código que começa com BL1:','aria-label':'Código para importar'});
  var shareMsg=h('p',{class:'status','aria-live':'polite'});
  function mkCode(){ return 'BL1:'+btoa(unescape(encodeURIComponent(JSON.stringify(ser(E))))); }
  var shareBox=h('details',null,h('summary',null,'Compartilhar ou importar um exercício'),
    h('div',{class:'field',style:'margin-top:10px'},
      h('div',{class:'label'},'Código deste exercício'),shareTa,
      h('div',{class:'row'},
        h('button',{class:'btn sm',onclick:function(){ shareTa.value=mkCode(); shareTa.select();
          var done=function(){shareMsg.textContent='Código copiado. Quem receber cola na caixa de importar.'};
          if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(shareTa.value).then(done,function(){shareMsg.textContent='Selecione o texto acima e copie.'});
          else shareMsg.textContent='Selecione o texto acima e copie.'; }},'Gerar e copiar código')),
      h('div',{class:'label',style:'margin-top:10px'},'Importar'),impTa,
      h('div',{class:'row'},
        h('button',{class:'btn sm',onclick:function(){
          try{
            var t=impTa.value.trim(); if(t.indexOf('BL1:')!==0) throw new Error('bad');
            var e=deser(JSON.parse(decodeURIComponent(escape(atob(t.slice(4))))));
            E=e; E.id=undefined; Es.curId=null; impTa.value=''; viewEst(main); say('Exercício importado. Toque em Salvar para guardar neste aparelho.');
          }catch(x){ shareMsg.textContent='Código inválido. Confira se copiou o texto inteiro, começando por BL1:.'; }
        }},'Importar')),
      shareMsg));

  main.append(
    h('h2',null,'Estúdio de viradas'),
    h('p',{class:'sub'},'Monte sua virada ou groove na grade, toque junto e guarde o exercício. Nada sai do seu aparelho.'),
    h('div',{class:'panel'},
      h('div',{class:'field'},h('div',{class:'label'},'Subdivisão'),divSeg),
      h('div',{class:'field',style:'margin-top:12px'},h('div',{class:'label'},'Compassos em 4/4'),barSeg),
      h('div',{style:'margin-top:14px'},gridBox),
      h('div',{class:'legend'},h('span',null,'Toque numa célula para ligar a peça.'),h('span',null,'Toque na linha D/E para alternar direita, esquerda ou vazio.')),
      h('div',{class:'row',style:'margin-top:12px'},
        h('button',{class:'btn sm',onclick:function(){ Eng.stop(); var nm=E.name,bp=E.bpm; E=blank(E.div,E.bars); E.name=nm; E.bpm=bp; Es.curId=Es.curId; build(); say('Grade limpa.'); }},'Limpar grade'))),
    h('div',{class:'panel'},tp.el),
    h('div',{class:'panel'},
      h('div',{class:'field'},h('label',{class:'label',for:'est-name'},'Nome do exercício'),nameIn),
      h('div',{class:'row',style:'margin-top:12px'},saveBtn,saveNew),status),
    h('div',{class:'sec'},h('div',{class:'label'},'Meus exercícios'),mineBox),
    h('div',{class:'sec'},h('div',{class:'label'},'Exemplos para começar'),exBox),
    h('div',{class:'panel'},shareBox));
  build(); renderMine(); renderEx(); refreshSaveBtns();
}

/* ---------- Navegação ---------- */
var main=$('#main'), cur='rud';
function Vw(v){
  cur=v;
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){
    if(b.dataset.v===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  (v==='rud'?viewRud:v==='grv'?viewGrv:viewEst)(main);
  window.scrollTo(0,0);
}
[].forEach.call(document.querySelectorAll('#tabs button'),function(b){ b.addEventListener('click',function(){ Vw(b.dataset.v); }); });
document.addEventListener('keydown',function(e){
  if(e.code!=='Space') return; var t=e.target&&e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='BUTTON'||t==='SELECT'||t==='SUMMARY') return;
  var p=document.querySelector('.play'); if(p){ e.preventDefault(); p.click(); }
});
var root=document.documentElement;
function effDark(){ var t=root.getAttribute('data-theme'); return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches; }
$('#themeBtn').addEventListener('click',function(){ root.setAttribute('data-theme',effDark()?'light':'dark'); });
Vw('rud');
})();
</script>

</body>
</html>
